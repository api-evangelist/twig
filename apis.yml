aid: twig
name: Twig
description: >-
  Twig (twig.bio) is a UK biotechnology company using artificial intelligence and machine
  learning to design sustainable bioengineered ingredients — "AI defined ingredients that
  don't cost the earth." Its proprietary twig:tech platform pairs bio:drive, an AI/ML design
  engine that generates and scores novel microbe designs across pathway and enzyme selection,
  gene edits, and expression levels, with grow:bot, an automated high-throughput lab that
  builds and tests those designs and feeds every result back into the next design cycle. Twig
  aims to cultivate clean ingredients from bacteria via fermentation rather than extracting
  them from the ground or sea or producing them with fossil fuels. Twig is a Seedcamp
  portfolio company and is backed by additional early-stage investors. This profile was added
  to the API Evangelist network from a VC portfolio lead; Twig currently exposes no public
  developer API, SDK, or documentation surface — its api./app. subdomains resolve to internal
  infrastructure — so this pass captures company identity and a domain-security probe only.
